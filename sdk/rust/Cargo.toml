[package]
name = "ibc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust bot SDK for Imperial Battlecode (wasm bots + native simulation backend)."

[workspace]

[dependencies]
ibc-abi = { path = "../../crates/abi" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ibc-abi = { path = "../../crates/abi", features = ["host"] }
