# (63 kills light armour in two, 75 would kill heavy in two). Slow to cycle, very slow to start after moving,
# and the two-tick startup warns the target.
[[weapon]]
name = "marksman"
slot = 0
price = 3200
damage = 74
pellets = 1
spread = 0
recoil_spread = 300
recoil_per_shot = 4
recoil_recovery = 1
