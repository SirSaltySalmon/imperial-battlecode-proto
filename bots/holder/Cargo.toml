[package]
name = "holder"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference bot: hold angles, rotate and defuse; slow silent attack."

# Standalone: build with `cargo build --release --target wasm32-wasip1`.
[workspace]

[dependencies]
ibc = { path = "../../sdk/rust" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
