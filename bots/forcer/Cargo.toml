[package]
name = "forcer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference bot: buys cheap every round and fights close. SMGs, shotguns, forward defence."

# Standalone: build with `cargo build --release --target wasm32-wasip1`.
[workspace]

[dependencies]
ibc = { path = "../../sdk/rust" }
squad = { path = "../squad" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
