[package]
name = "sapper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference bot: the objective first. Runs at a site together, plants under cover, holds the charge."

# Standalone: build with `cargo build --release --target wasm32-wasip1`.
[workspace]

[dependencies]
ibc = { path = "../../sdk/rust" }
squad = { path = "../squad" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
