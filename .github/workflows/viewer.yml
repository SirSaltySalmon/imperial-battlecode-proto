name: Viewer

# Only when the viewer changed, and only if there is a viewer to build.
on:
  pull_request:
    paths:
      - "viewer/**"
      - ".github/workflows/viewer.yml"
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - ".github/workflows/viewer.yml"

concurrency:
  group: viewer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Is there a viewer?
        id: viewer
        run: |
          if [ -f viewer/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "viewer/package.json not found: nothing to build"; fi
      - uses: actions/setup-node@v7
        if: steps.viewer.outputs.present == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.viewer.outputs.present == 'true'
        working-directory: viewer
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build
        if: steps.viewer.outputs.present == 'true'
        working-directory: viewer
        run: npm run build --if-present
      - name: Test
        if: steps.viewer.outputs.present == 'true'
        working-directory: viewer
        run: npm test --if-present
