# One box: the coordinator and N workers.
#
#   export IBC_REGISTRATION_TOKEN=$(openssl rand -hex 24)
#   docker compose -f deploy/docker-compose.yml up -d --build --scale worker=4
#
# ASSUMPTION: the coordinator is built by another unit. This file expects an image for it
# (IBC_COORDINATOR_IMAGE) that listens on :8080 and takes the registration token from
# IBC_REGISTRATION_TOKEN; adjust `coordinator:` to its real flags. The worker service is complete as is.

services:
  coordinator:
    image: ${IBC_COORDINATOR_IMAGE:?set IBC_COORDINATOR_IMAGE to the coordinator image}
    restart: unless-stopped
    environment:
      IBC_REGISTRATION_TOKEN: ${IBC_REGISTRATION_TOKEN:?set IBC_REGISTRATION_TOKEN}
    ports:
      - "8080:8080" # put a TLS-terminating proxy in front before exposing this beyond the box
    volumes:
      - coordinator-data:/data

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    image: ibc-worker:local
    restart: on-failure
    depends_on:
      - coordinator
    environment:
      IBC_COORDINATOR: http://coordinator:8080
      IBC_REGISTRATION_TOKEN: ${IBC_REGISTRATION_TOKEN:?set IBC_REGISTRATION_TOKEN}
      IBC_WORKER_LABELS: trusted,x86_64-linux # same box as the coordinator: these are the trusted workers
      IBC_WORKER_CONCURRENCY: ${IBC_WORKER_CONCURRENCY:-2}
    # One cache per container (anonymous volume from the image): a cache directory must not be shared
    # between worker processes. Scale with `--scale worker=N`; N x concurrency should not exceed the cores.
    stop_grace_period: 100s # SIGTERM drains; give running matches time to finish
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  coordinator-data:
