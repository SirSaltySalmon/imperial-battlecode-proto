[package]
name = "ibc-worker"
description = "Imperial Battlecode match worker: leases jobs from the coordinator and drives the `ibc` runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ibc_worker"
path = "src/lib.rs"

[[bin]]
name = "ibc-worker"
path = "src/main.rs"

# No ibc-runner / wasmtime here on purpose: the worker supervises versioned `ibc` binaries as subprocesses,
# so one worker can serve several patches and stays a small static binary.
[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.11"
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
tiny_http = "0.12"
# tests/e2e.rs: the real coordinator, in-process, against real worker processes.
ibc-coordinator = { path = "../coordinator" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
