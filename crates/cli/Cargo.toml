[package]
name = "ibc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `ibc` command: build bots, run matches and batches, inspect and verify replays."

[[bin]]
name = "ibc"
path = "src/main.rs"

[dependencies]
ibc-abi = { workspace = true }
ibc-engine = { workspace = true }
ibc-replay = { workspace = true }
ibc-runner = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
toml = { workspace = true }
