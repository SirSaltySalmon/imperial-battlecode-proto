[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"

# A bot is its own cargo workspace. `ibc build bots/{{name}}` runs
# `cargo build --release --target wasm32-wasip1` here and installs the module at .ibc/bot.wasm.
[workspace]

[dependencies]
# The SDK that `ibc init` wrote into this workspace; re-run `ibc init` after updating ibc to refresh it.
ibc = { path = "../../.ibc/sdk/rust" }

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
